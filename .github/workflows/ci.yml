name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the test job only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      # Pinned by commit SHA, not tag: tags are mutable. Dependabot updates
      # these and the trailing comment says which version each SHA is.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Install Tk (Linux)
        # flavorforge.py imports tkinter at module level, so even the pure
        # data and engine tests need it importable. No display is required —
        # nothing here constructs a window.
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk

      - name: Run tests
        # -rs lists every skipped test with its reason, so a leg of the matrix
        # that quietly covers less than it looks like is visible in the log.
        run: python -m pytest -q -rs
