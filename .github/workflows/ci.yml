name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the test job only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    # Every leg must actually run the GUI tests: with this set, one that cannot
    # open a window fails the run instead of skipping (tests/conftest.py).
    env:
      FLAVORFORGE_REQUIRE_GUI: "1"

    steps:
      # Pinned by commit SHA, not tag: tags are mutable. The trailing comment
      # says which version each SHA is; Dependabot (.github/dependabot.yml)
      # bumps both together, monthly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Install a virtual display (Linux)
        # tests/test_gui.py builds the real window and drives its handlers.
        # The runner has no display, so without Xvfb every one of those tests
        # skips on Linux and only the Windows legs exercise the GUI -- which
        # is exactly the platform split the mouse-wheel fix depends on.
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Run tests (Linux)
        # -rs lists every skipped test with its reason, so a leg of the matrix
        # that quietly covers less than it looks like is visible in the log.
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q -rs

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q -rs
