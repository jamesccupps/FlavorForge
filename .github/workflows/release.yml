name: Release

# Pushing a v* tag publishes the GitHub release for it: the tagged source is
# tested (GUI included), the tag is checked against the version in the code,
# and the notes are that version's CHANGELOG section. The job's own token
# creates the release, so cutting one needs no browser sign-in and no stored
# secret -- 3.3.1 sat as a tag with no release because the only way to
# publish was the web form.
#
# Publishing to PyPI is a second job, off until the repository variable
# PUBLISH_TO_PYPI is set to "true". It uses PyPI trusted publishing, so it
# needs a one-time setup on pypi.org (project flavorforge, owner jamesccupps,
# repository FlavorForge, workflow release.yml, environment pypi) rather than
# an API token.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Test and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release
    env:
      FLAVORFORGE_REQUIRE_GUI: "1"
    steps:
      # Pinned by commit SHA, as in ci.yml; Dependabot keeps both current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: The tag matches the version in the code
        run: |
          code=$(python -c "import flavorforge; print(flavorforge.__version__)")
          if [ "${GITHUB_REF_NAME#v}" != "$code" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but flavorforge.__version__ is $code"
            exit 1
          fi

      - name: Install test tooling and a virtual display
        run: |
          python -m pip install --upgrade pip pytest
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Test the tagged source
        run: xvfb-run -a python -m pytest -q -rs

      - name: Release notes from the CHANGELOG
        run: python tools/release_notes.py "$GITHUB_REF_NAME" > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it as it is."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "FlavorForge ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi

  pypi:
    name: Publish to PyPI
    needs: release
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing: no stored PyPI token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Build the sdist and wheel
        run: |
          python -m pip install build==1.6.1
          python -m build

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
